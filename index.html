<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NPC con AR.js + Gemini</title>
  <style>
    body { margin: 0; overflow: hidden; }
    #dialogBox {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.8);
      color: white;
      padding: 12px 20px;
      border-radius: 12px;
      max-width: 85%;
      text-align: center;
      z-index: 100;
      display: none;
    }
  </style>
</head>
<body>
  <div id="dialogBox"></div>

  <!-- AR.js + Three.js -->
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.min.js"></script>

  <script>
    // === CONFIGURACIÓN ===
    let conversationHistory = [];
    const dialogBox = document.getElementById('dialogBox');

    function speakAndShow(text) {
      dialogBox.textContent = text;
      dialogBox.style.display = 'block';
      if ('speechSynthesis' in window) {
        speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.lang = 'es-ES';
        speechSynthesis.speak(u);
      }
      setTimeout(() => dialogBox.style.display = 'none', 6000);
    }

    async function sendMessageToAI(msg) {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({message: msg, history: conversationHistory})
      });
      const data = await res.json();
      return data.reply || "Lo siento.";
    }

    function startListening() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) return speakAndShow("Micrófono no soportado.");
      
      const rec = new SpeechRecognition();
      rec.lang = 'es-ES';
      rec.start();
      rec.onresult = async (e) => {
        const userText = e.results[0][0].transcript;
        speakAndShow(`Tú: ${userText}`);
        const aiReply = await sendMessageToAI(userText);
        conversationHistory.push({role:'user',content:userText},{role:'assistant',content:aiReply});
        speakAndShow(aiReply);
      };
      rec.onerror = () => speakAndShow("No te escuché bien.");
    }

    // Instrucciones para el usuario
    alert("1. Imprime o abre en otro dispositivo esta imagen:\nhttps://raw.githubusercontent.com/AR-js-org/AR.js/master/data/images/HIRO.jpg\n2. Apunta la cámara a esa imagen.");
  </script>

  <!-- Escena AR con marcador HIRO -->
  <a-scene
    vr-mode-ui="enabled: false"
    arjs="sourceType: webcam; debugUIEnabled: false;"
    renderer="logarithmicDepthBuffer: true;"
  >
    <a-marker preset="hiro">
      <a-box position="0 0.5 0" color="#0088FF" depth="0.2" height="0.8" width="0.2"></a-box>
    </a-marker>
    <a-entity camera></a-entity>
  </a-scene>

  <script>
    // Al tocar la pantalla → hablar
    document.body.addEventListener('click', startListening);
  </script>
</body>
</html>
